name: socket-dependency-guard

on:
  push:
    branches:
      - "**"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: socket-scan-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  socket-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Socket CLI
        run: pip install socketsecurity --upgrade

      - name: Run Socket CI scan
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: socket ci

      # Optional: install-time enforcement via Socket Firewall (free tier).
      # Blocks fetches of confirmed-malicious packages including transitive ones.
      # No API key required for firewall-free mode.
      # Remove this block, or switch mode to `firewall-enterprise` (with `socket-token`),
      # if you do not want install-time enforcement.
      - name: Install Socket Firewall
        uses: SocketDev/action@v1.3.1
        with:
          mode: firewall-free

      # Replace the install command for your ecosystem, e.g.:
      #   sfw npm ci
      #   sfw pnpm install --frozen-lockfile
      #   sfw yarn install --immutable
      #   sfw pip install -r requirements.txt
      #   sfw uv sync
      #   sfw cargo fetch
      - name: Protected install (example)
        if: false
        run: sfw npm ci
